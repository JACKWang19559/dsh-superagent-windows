name: Windows installation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installation:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          run_install: false
      - name: Build, run focused checks and prepare runtime dependencies
        shell: pwsh
        run: ./scripts/build-windows.ps1
